# codecongruence config for claude-all.
# See https://github.com/brunofaust/codecongruence for the full option reference
# (codecongruence.toml.example in that repo documents every rule/key).

[rules.duplicate_functions]
# Hook scripts under src/claude_all/hooks/ and every skill's hook.py companion
# are deployed as individually-symlinked, standalone single files (see cli.py's
# hook_symlink_dest / install_standalone_hook) — they cannot share code via a
# sibling import. regression-gates/checkers/*.py are copy-into-your-project
# templates (see that skill's SKILL.md), meant to be lifted as single files
# into a consuming repo's own CI. Both patterns are expected to duplicate small
# dispatch helpers (main/remind/ask/nudge/iter_py_files) by design.
exclude = [
  "src/claude_all/hooks/**",
  "src/claude_all/skills/**/hook.py",
  # Self-contained, copy-into-your-project template scripts under ANY skill's
  # checkers/ or scripts/ dir (regression-gates, brunofaust-python-style, …). Each
  # is lifted as ONE file into a consuming repo's CI, so they share dispatch
  # scaffolding (main / iter_py_files / _name_of / find_violations / check_tree)
  # BY DESIGN — a shared import would break the single-file-copy model. The
  # duplication IS the portability, not debt. Glob, not an enumerated list, so a
  # new checker added to any skill is covered automatically without re-baselining.
  "src/claude_all/skills/**/checkers/**",
  "src/claude_all/skills/**/scripts/**",
  # Tests. Cases for one function are arrange-act-assert siblings by design — they
  # differ only in the input and the expected result, which is what makes them
  # readable. Deduping them (a shared parametrized mega-test) would HIDE which case
  # broke. Genuine setup duplication is still extracted into fixtures/helpers, which
  # is where the real dedup belongs.
  "tests/**",
]
