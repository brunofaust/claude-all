[project]
name = "claude-all"
version = "0.3.0"
description = "Claude skills, agents and everything else to improve coding with Claude"
readme = "README.md"
keywords = [ "claude", "agent", "mcp", "plugin", "skill", "tool" ]
license = { file = "LICENSE" }
authors = [ { name = "Bruno Faust" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []
urls.Homepage = "https://github.com/brunofaust/claude-all"
urls.Issues = "https://github.com/brunofaust/claude-all/issues"
urls.Repository = "https://github.com/brunofaust/claude-all"
scripts.claude-all = "claude_all.cli:run"

[dependency-groups]
dev = [
  "prek>=0.4.1",
]

[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.25" ]

[tool.hatch.build.targets.wheel]
packages = [ "src/claude_all" ]
include = [
  "src/claude_all/agents",
  "src/claude_all/skills",
  "src/claude_all/hooks",
  "src/claude_all/instructions",
  "src/claude_all/mcps",
  "src/claude_all/plugins",
  "src/claude_all/tools",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [ ".claude/", ".venv/", ".worktrees/" ]
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "RUF", # ruff-specific rules
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [
  "RUF001", # ambiguous unicode — skill content intentionally uses special chars
]
lint.isort.known-first-party = [ "claude_all" ]
# vulture_whitelist.py is a list of bare identifier names (vulture's whitelist
# format), not executable code — exempt it from "useless expression" / "undefined
# name" lints.
lint.per-file-ignores."vulture_whitelist.py" = [ "B018", "F821" ]

[tool.vulture]
min_confidence = 60
paths = [ "src/claude_all/cli.py", "src/claude_all/hooks", "src/claude_all/skills", "vulture_whitelist.py" ]
exclude = [ ".venv/", ".worktrees/", ".claude/" ]

[tool.typos]

[tool.markdownlint]
default = true
MD003 = { style = "atx" }
MD007 = { indent = 4 }
no-hard-tabs = true
whitespace = true
files = [ "**/*.md" ]
MD013 = false
MD040 = false
MD025 = false

[tool.semantic_release]
version_toml = [ "pyproject.toml:project.version" ]
tag_format = "v{version}"
major_on_zero = false
commit_message = "chore(release): v{version} [skip ci]"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
  "^chore",
  "^docs",
  "^test",
  "^build",
  "^ci",
  "^refactor",
  "^style",
  "^Merge (pull request|branch)",
]
upload_to_pypi = false
build_command = ""
remote.type = "github"

# python-semantic-release>=9 ignores the legacy flat `branch = "main"` key —
# it only recognizes nested branch groups. The `prepare` job in release.yml
# runs `semantic-release version --print` on a `release/**` branch (before
# it's merged to main), so that pattern must be an explicit release-eligible
# group or PSR reports "isn't in any release groups" and computes nothing.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.release]
match = "release/.*"
prerelease = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = false
