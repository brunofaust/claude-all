[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.25" ]

[project]
name = "claude-all"
version = "0.1.0"
description = "Claude skills, agents and everything else to improve coding with Claude"
readme = "README.md"
keywords = [ "claude", "agent", "mcp", "plugin", "skill", "tool" ]
license = { file = "LICENSE" }
authors = [ { name = "Bruno Faust" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []
urls.Homepage = "https://github.com/brunofaust/claude-all"
urls.Issues = "https://github.com/brunofaust/claude-all/issues"
urls.Repository = "https://github.com/brunofaust/claude-all"
scripts.claude-all = "claude-all.cli:app"

[dependency-groups]
dev = [
  "prek>=0.4.1"
]

[tool.hatch]
build.targets.wheel.packages = [ "src/claude-all" ]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [ ".claude/", ".venv/", ".worktrees/"]
preview = true
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "ANN",   # type-hint coverage
  "ASYNC", # flake8-async (detect blocking calls in async)
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "D",     # pydocstyle (checks presence, structural syntax, formatting)
  "DOC",   # pydoclint (validates if args/returns/raises match code signatures)
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "PL",    # pylint subset
  "RUF",   # ruff-specific rules
  "S",     # flake8-bandit (security)
  "SIM",   # flake8-simplify
  "TCH",   # type-checking-only imports
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
lint.ignore = [
  "S404", # subprocess import — intentional, git helpers shell out by design
  "S603", # subprocess without shell — that's the safe path
  "S607", # partial path on `git` — git is on PATH everywhere
]
lint.per-file-ignores."claude-all.py" = [
  "ANN",  # type annotations — CLI script, not a library
  "D",    # docstrings — CLI entry point, not a library module
  "DOC",  # pydoclint — CLI script
  "PLR",  # pylint complexity — functional TUI code with intentional branches
]
lint.per-file-ignores."coding/**/*.py" = [
  "D103",    # missing docstrings on main() — hook scripts, not library modules
  "PLC0415", # imports not at top-level — intentional lazy loading in some hooks
]
lint.isort.known-first-party = [ "claude-all" ]
lint.pydocstyle.convention = "google"  # Explicitly force Google style documentation syntax

[tool.typos]

[tool.bandit]
exclude_dirs = [ "tests", ".venv", ".worktrees" ]
skips = [
  "B101", # assert statements
  "B404", # import subprocess — git helpers shell out by design
  "B603", # subprocess without shell — that's the safe path
  "B607", # partial path on `git` — git is on PATH everywhere
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
#mypy_path = "src"
#files = [ "src/claude-all" ]
exclude = [ "^\\.worktrees/", "^\\.claude/" ]

# [[tool.mypy.overrides]]
# module = [ "fastembed", "fastembed.*" ]
# ignore_missing_imports = true

# [[tool.mypy.overrides]]
# module = [ "tree_sitter", "tree_sitter_python", "tree_sitter_javascript", "tree_sitter_typescript" ]
# ignore_missing_imports = true

# [[tool.mypy.overrides]]
# module = "tests.*"
# disallow_untyped_defs = false

[tool.coverage]
report.exclude_also = [
  "@(abc\\.)?abstractmethod",
  "def __repr__",
  "if __name__ == .__main__.:",
  "if 0:",
  "if self\\.debug",
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
]

[tool.interrogate]
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-setters = true
ignore-overloaded-functions = true
fail-under = 100
exclude = [ "__init__.py", "tests", ".venv", "conftest.py", ".worktrees", ".claude" ]
style = "google"
verbose = 1
quiet = false
color = true
omit-covered-files = true

[tool.markdownlint]
default = true
MD003 = { style = "atx" }
MD007 = { indent = 4 }
no-hard-tabs = true
whitespace = true
files = [ "**/*.md" ]
MD013 = false
MD040 = false
MD025 = false

[tool.vulture]
min_confidence = 80
ignore_decorators = [ "@app.*", "@*.command", "@*.callback" ]
ignore_names = [
  "exc_type",
  "exc_val",
  "exc_tb",
  "model_config",  # Pydantic class-level config, read at class creation time
  "description",   # Rule protocol attribute, used by reporters at runtime
  "covers",        # ChangedFile public API, used in tests
  "enabled_rules", # claude-allConfig public API
  "extra",         # RuleConfig helper, accessed by rules via getattr
]
paths = [ "src/claude-all" ]
verbose = false
exclude = [
  ".venv/*.py",
  ".claude/*.py",
  ".worktrees/*.py",
  ".mypy_cache/*.py",
  ".pytest_cache/*.py",
  ".ruff_cache/*.py",
]
