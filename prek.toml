default_language_version.python = "3.11"

exclude = { glob = [".claude/**", ".worktrees/**", ".mypy_cache/**"] }

default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  {
    id = "check-json",
    name = "✅ check · Validate json files"
  },
  {
    id = "check-toml",
    name = "✅ check · Validate toml files"
  },
  {
    id = "check-yaml",
    name = "✅ check · Validate yaml files"
  },
  # Whitespace/EOL fixers skip vendored dirs — vendored files must stay
  # byte-identical to upstream even when upstream ships trailing whitespace;
  # a local "fix" would make vendor_sync --check report drift forever.
  {
    id = "end-of-file-fixer",
    name = "✅ check · Fix end of file",
    exclude = { glob = ["src/claude_all/skills/frontend/react-best-practices/**", "src/claude_all/skills/frontend/composition-patterns/**", "src/claude_all/skills/frontend/react-view-transitions/**", "src/claude_all/skills/generic/humanink/**"] }
  },
  {
    id = "trailing-whitespace",
    name = "✅ check · Trailing whitespaces",
    exclude = { glob = ["src/claude_all/skills/frontend/react-best-practices/**", "src/claude_all/skills/frontend/composition-patterns/**", "src/claude_all/skills/frontend/react-view-transitions/**", "src/claude_all/skills/generic/humanink/**"] }
  },
  {
    id = "debug-statements",
    name = "✅ check · Debug statements"
  },
  {
    id = "mixed-line-ending",
    name = "✅ check · Mixed line ending",
    exclude = { glob = ["src/claude_all/skills/frontend/react-best-practices/**", "src/claude_all/skills/frontend/composition-patterns/**", "src/claude_all/skills/frontend/react-view-transitions/**", "src/claude_all/skills/generic/humanink/**"] }
  },
  {
    id = "check-case-conflict",
    name = "📁 filesystem/📝 names · Check case sensitivity"
  },
  {
    id = "check-symlinks",
    name = "📁 filesystem/🔗 symlink · Check symlink validity"
  },
  {
    id = "destroyed-symlinks",
    name = "📁 filesystem/🔗 symlink · Detect broken symlinks",
    exclude = { glob = [".git/worktrees/**", ".worktrees/**"] }
  },
  {
    id = "check-merge-conflict",
    name = "🌳 git · Detect conflict markers"
  },
  {
    id = "forbid-new-submodules",
    name = "🌳 git · Prevent submodule creation"
  },
  {
    id = "no-commit-to-branch",
    name = "🌳 git · Protect main branches"
  },
  {
    id = "check-added-large-files",
    name = "🌳 git · Block large file commits",
    args = ["--maxkb=100000"]
  }
]

# ── Conventional commits (commit-msg stage) ──────────────────────────────────
# Enforces Conventional Commits format: feat/fix/chore/docs/refactor/test/etc.
# Only runs on commit-msg stage so it doesn't block --amend or WIP pushes.
[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v3.29.0"
hooks = [
  {
    id = "commitizen",
    name = "📝 git · Conventional commit format",
    stages = ["commit-msg"]
  }
]

[[repos]]
repo = "https://github.com/Lucas-C/pre-commit-hooks"
rev = "v1.5.6"
hooks = [
  {
    id = "remove-crlf",
    name = "✅ check · Remove CRLF"
  },
  {
    id = "remove-tabs",
    name = "✅ check · Remove tabs"
  }
]

[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.21.2"
hooks = [
  {
    id = "pyupgrade",
    name = "🐍 python · Upgrade version 3.11+",
    args = ["--py311-plus"]
  }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.14"
hooks = [
  {
    id = "ruff-check",
    name = "🐍 python · Check with Ruff",
    args = ["--fix"],
    types_or = [
      "python",
      "pyi"
    ]
  },
  {
    id = "ruff-format",
    name = "🐍 python · Format with Ruff",
    types_or = [
      "python",
      "pyi"
    ]
  }
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.46.2"
hooks = [
  {
    id = "typos",
    name = "🔍 content · Check typos",
    # The prek skill documents typo-handling and deliberately contains example
    # misspellings + multi-language sample words; exclude it so typos doesn't flag or
    # rewrite those examples. (This is the skill's own "scope-exclude a path" lever,
    # applied to itself.)
    # CHANGELOG.md is machine-generated by python-semantic-release (commit-hash links
    # etc.) — excluded because random hex substrings occasionally collide with real
    # words (e.g. `abc1def2` colliding with real terms like "ab" or "de").
    exclude = { glob = ["src/claude_all/skills/generic/prek/**", "src/claude_all/skills/generic/humanink/**", "CHANGELOG.md"] }
  }
]

# ── Type checking (mypy) ─────────────────────────────────────────────────────
# Scoped to the installer, scripts/, src/claude_all/hooks/ and src/claude_all/tools/. Skill-embedded hook.py
# files all share the module name "hook", which mypy refuses to check in one
# batch — those stay covered by ruff + vulture.
[[repos]]
repo = "https://github.com/pre-commit/mirrors-mypy"
rev = "v2.1.0"
hooks = [
  {
    id = "mypy",
    name = "🐍 python · Type-check with mypy",
    files = '^(src/claude_all/cli\.py|scripts/.*\.py|src/claude_all/hooks/.*\.py|src/claude_all/tools/.*\.py)$'
  }
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  {
    id = "gitleaks",
    name = "🔒 security · Detect secrets"
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pygrep-hooks"
rev = "v1.10.0"
hooks = [
  {
    id = "python-check-blanket-type-ignore",
    name = "🐍 python · Enforce not blanket #type: ignore"
  },
  {
    id = "python-check-mock-methods",
    name = "🐍 python · Prevent common mistakes of mocking"
  },
  {
    id = "python-no-log-warn",
    name = "🐍 python · Not using deprecated log.warn"
  },
  {
    id = "python-use-type-annotations",
    name = "🐍 python · Enforce type annotations not comments"
  },
  {
    id = "text-unicode-replacement-char",
    name = "🐍 python · Forbid UTF-8 Unicode replacement character"
  }
]

# ── Dead code (vulture) ──────────────────────────────────────────────────────
# Local hook: scans the paths in [tool.vulture] (pyproject.toml) at min_confidence
# 60. False positives / intentionally-retained names live in vulture_whitelist.py.
[[repos]]
repo = "local"
hooks = [
  {
    id = "vulture",
    name = "🐍 python · Dead code (vulture)",
    entry = "vulture",
    language = "python",
    additional_dependencies = ["vulture==2.14"],
    pass_filenames = false,
    types = ["python"]
  },
  # Regression gate: real project names + tool-call XML artifacts must never
  # appear in shipped agents/skills/instructions (repo CLAUDE.md naming rules).
  # Vendored dirs are excluded — they stay byte-identical to upstream. Real
  # names in prek.toml itself are fine (functional config; outside `files`).
  {
    id = "banned-project-names",
    name = "🔍 content · Banned project names / artifacts",
    entry = 'busydone|BDD#|[Mm]ini[Ss]tack|</content>|</invoke>',
    language = "pygrep",
    files = '^src/claude_all/(agents|skills|instructions)/',
    exclude = { glob = ["src/claude_all/skills/frontend/react-best-practices/**", "src/claude_all/skills/frontend/composition-patterns/**", "src/claude_all/skills/frontend/react-view-transitions/**", "src/claude_all/skills/generic/humanink/**"] }
  }
]

[[repos]]
repo = "https://github.com/brunofaust/codecongruence"
rev = "v0.4.0"
hooks = [
  {
    id = "codecongruence",
    name = "🧠 semantic · codecongruence"
  }
]

# ── Lockfile ─────────────────────────────────────────────────────────────────
# Keeps uv.lock in step with pyproject.toml. Without it the two drift silently:
# python-semantic-release rewrites ONLY `pyproject.toml:project.version` on
# release and never touches uv.lock, so the lockfile's record of this package's
# OWN version goes stale every release — and the next `uv sync` rewrites that
# line and dirties an unrelated working tree. (release.yml's prepare job now runs
# `uv lock` itself, since no hook runs in CI; this hook is the local half.)
#
# pre-push, not pre-commit: it REWRITES uv.lock, and a hook that mutates a file
# fails the run it mutates on — deferring to push keeps `git commit` from
# bouncing on a lockfile refresh mid-work.
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.11.16"
hooks = [
  {
    id = "uv-lock",
    name = "📦 uv · Lock dependencies",
    stages = ["pre-push"]
  }
]

# ── Dependency-manifest integrity ─────────────────────────────────────────────
# Every `claude-all.json` `requires` entry must resolve to a real resource, or the
# installer would silently skip a dependency. Runs whenever a manifest or the
# installer changes (a rename in cli.py's discover() can invalidate a requires).
[[repos]]
repo = "local"
hooks = [
  {
    id = "check-requires",
    name = "🔗 deps · Validate claude-all.json requires",
    entry = "python3 scripts/check_requires.py",
    language = "system",
    pass_filenames = false,
    always_run = true
  }
]
