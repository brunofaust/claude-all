default_language_version.python = "3.11"

exclude = { glob = [".claude/**", ".worktrees/**", ".mypy_cache/**"] }

default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  {
    id = "check-json",
    name = "✅ check · Validate json files"
  },
  {
    id = "check-toml",
    name = "✅ check · Validate toml files"
  },
  {
    id = "check-yaml",
    name = "✅ check · Validate yaml files"
  },
  {
    id = "end-of-file-fixer",
    name = "✅ check · Fix end of file"
  },
  {
    id = "trailing-whitespace",
    name = "✅ check · Trailing whitespaces"
  },
  {
    id = "debug-statements",
    name = "✅ check · Debug statements"
  },
  {
    id = "mixed-line-ending",
    name = "✅ check · Mixed line ending"
  },
  {
    id = "check-case-conflict",
    name = "📁 filesystem/📝 names · Check case sensitivity"
  },
  {
    id = "check-symlinks",
    name = "📁 filesystem/🔗 symlink · Check symlink validity"
  },
  {
    id = "destroyed-symlinks",
    name = "📁 filesystem/🔗 symlink · Detect broken symlinks",
    exclude = { glob = [".git/worktrees/**", ".worktrees/**"] }
  },
  {
    id = "check-merge-conflict",
    name = "🌳 git · Detect conflict markers"
  },
  {
    id = "forbid-new-submodules",
    name = "🌳 git · Prevent submodule creation"
  },
  {
    id = "no-commit-to-branch",
    name = "🌳 git · Protect main branches"
  },
  {
    id = "check-added-large-files",
    name = "🌳 git · Block large file commits",
    args = ["--maxkb=100000"]
  }
]

# ── Conventional commits (commit-msg stage) ──────────────────────────────────
# Enforces Conventional Commits format: feat/fix/chore/docs/refactor/test/etc.
# Only runs on commit-msg stage so it doesn't block --amend or WIP pushes.
[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v3.29.0"
hooks = [
  {
    id = "commitizen",
    name = "📝 git · Conventional commit format",
    stages = ["commit-msg"]
  }
]

[[repos]]
repo = "https://github.com/Lucas-C/pre-commit-hooks"
rev = "v1.5.6"
hooks = [
  {
    id = "remove-crlf",
    name = "✅ check · Remove CRLF"
  },
  {
    id = "remove-tabs",
    name = "✅ check · Remove tabs"
  }
]

[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.21.2"
hooks = [
  {
    id = "pyupgrade",
    name = "🐍 python · Upgrade version 3.11+",
    args = ["--py311-plus"]
  }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.14"
hooks = [
  {
    id = "ruff-check",
    name = "🐍 python · Check with Ruff",
    args = ["--fix"],
    types_or = [
      "python",
      "pyi"
    ]
  },
  {
    id = "ruff-format",
    name = "🐍 python · Format with Ruff",
    types_or = [
      "python",
      "pyi"
    ]
  }
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.46.2"
hooks = [
  {
    id = "typos",
    name = "🔍 content · Check typos",
    # The prek skill documents typo-handling and deliberately contains example
    # misspellings + multi-language sample words; exclude it so typos doesn't flag or
    # rewrite those examples. (This is the skill's own "scope-exclude a path" lever,
    # applied to itself.)
    exclude = { glob = ["skills/generic/prek/**", "skills/generic/humanink/**"] }
  }
]

# ── Type checking (mypy) ─────────────────────────────────────────────────────
# Scoped to the installer, scripts/, hooks/ and tools/. Skill-embedded hook.py
# files all share the module name "hook", which mypy refuses to check in one
# batch — those stay covered by ruff + vulture.
[[repos]]
repo = "https://github.com/pre-commit/mirrors-mypy"
rev = "v2.1.0"
hooks = [
  {
    id = "mypy",
    name = "🐍 python · Type-check with mypy",
    files = '^(claude-all\.py|scripts/.*\.py|hooks/.*\.py|tools/.*\.py)$'
  }
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  {
    id = "gitleaks",
    name = "🔒 security · Detect secrets"
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pygrep-hooks"
rev = "v1.10.0"
hooks = [
  {
    id = "python-check-blanket-type-ignore",
    name = "🐍 python · Enforce not blanket #type: ignore"
  },
  {
    id = "python-check-mock-methods",
    name = "🐍 python · Prevent common mistakes of mocking"
  },
  {
    id = "python-no-log-warn",
    name = "🐍 python · Not using deprecated log.warn"
  },
  {
    id = "python-use-type-annotations",
    name = "🐍 python · Enforce type annotations not comments"
  },
  {
    id = "text-unicode-replacement-char",
    name = "🐍 python · Forbid UTF-8 Unicode replacement character"
  }
]

# ── Dead code (vulture) ──────────────────────────────────────────────────────
# Local hook: scans the paths in [tool.vulture] (pyproject.toml) at min_confidence
# 60. False positives / intentionally-retained names live in vulture_whitelist.py.
[[repos]]
repo = "local"
hooks = [
  {
    id = "vulture",
    name = "🐍 python · Dead code (vulture)",
    entry = "vulture",
    language = "python",
    additional_dependencies = ["vulture==2.14"],
    pass_filenames = false,
    types = ["python"]
  },
  # Regression gate: real project names + tool-call XML artifacts must never
  # appear in shipped agents/skills/instructions (repo CLAUDE.md naming rules).
  # Vendored dirs are excluded — they stay byte-identical to upstream. Real
  # names in prek.toml itself are fine (functional config; outside `files`).
  {
    id = "banned-project-names",
    name = "🔍 content · Banned project names / artifacts",
    entry = 'busydone|BDD#|[Mm]ini[Ss]tack|</content>|</invoke>',
    language = "pygrep",
    files = '^(agents|skills|instructions)/',
    exclude = { glob = ["skills/frontend/react-best-practices/**", "skills/frontend/composition-patterns/**", "skills/frontend/react-view-transitions/**", "skills/generic/humanink/**"] }
  }
]

[[repos]]
repo = "https://github.com/brunofaust/codecongruence"
rev = "v0.4.0"
hooks = [
  {
    id = "codecongruence",
    name = "🧠 semantic · codecongruence"
  }
]
